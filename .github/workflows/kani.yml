# Weekly Kani formal-verification run (issue #43). Kani is a bounded
# model checker for Rust; we use it to prove that the HTML escape
# function is idempotent (`escape(escape(x)) == escape(x)`) and never
# emits a bare `<` or `>`. The proofs live inside src/engine.rs gated
# by `#[cfg(kani)]` so they're invisible to ordinary builds.
#
# Run locally with:
#   cargo install --locked kani-verifier
#   cargo kani-setup
#   cargo kani

name: Kani

on:
  schedule:
    # Sunday 04:00 UTC.
    - cron: "0 4 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kani-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kani:
    name: Kani proofs
    runs-on: ubuntu-latest
    # Kani install + setup is heavy; allow ~45 min.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Install Kani
        uses: model-checking/kani-github-action@v1
        with:
          enable-propproof: false
          args: |
            --tests

      - name: Run Kani proofs
        # Only the harness that converges. `proof_escape_is_idempotent`
        # escapes twice -- the second pass takes the first pass's output
        # as symbolic input -- and produced no verdict in 60 minutes at
        # either a 3- or 2-byte input, against 13m22s for this one. It
        # stays in the source, runnable by hand, and the property it
        # covers is defended by the proptest equivalence checks in
        # `escape_reference_equivalence` and by tests/differential.rs.
        # See issue #74 for the full measurements.
        run: cargo kani --harness proof_no_bare_angle_brackets

# Release pipeline. Fires on annotated `v*.*.*` tags. Verification,
# `cargo publish` and SBOM/Sigstore signing all run inline here -- the
# publish was moved out of the `sebastienrousseau/pipelines` reusable
# workflow (see the comment above the publish job) and this header had
# not been updated to match.
#
# Before pushing a tag:
#   1. Update `[workspace.package] version` (and the `=x.y.z` internal
#      pins) in the root Cargo.toml and land it on `main`.
#   2. `git tag -s vX.Y.Z -m "release X.Y.Z"` then `git push --tags`.

name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Build and validate, but do not publish or create a release"
        default: true
        type: boolean

# Default to no permissions; per-job blocks below grant the
# minimum each job needs (verify + publish are both contents:
# read — cargo publish authenticates via CARGO_REGISTRY_TOKEN,
# not the GitHub Actions token).
permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Cross-platform sanity check before publishing. Library crates don't
  # ship per-OS binaries, but a Linux-only release has historically hidden
  # platform-specific regressions (path separators, TLS backends, …) that
  # only surface when a consumer builds on macOS/Windows. Runs the same
  # `cargo test --all-features` our CI runs, on all three host OSes.
  verify:
    name: Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Release preflight
        # The tag must match Cargo.toml and every version-bearing file.
        run: ./scripts/release-preflight.sh "${GITHUB_REF_NAME}"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: release-verify-${{ matrix.os }}
          save-if: false
      - run: cargo test --all-features
        shell: bash

  # Direct publish step. We previously delegated this to the reusable
  # workflow at `sebastienrousseau/pipelines/.github/workflows/release.yml`,
  # but that workflow downloads the per-target build artifact + SBOM
  # into the working tree before invoking `cargo publish`, which then
  # refuses to proceed ("files in the working directory contain
  # changes that were not yet committed into git"). Until the reusable
  # workflow fixes that ordering, we do the publish here directly —
  # `staticweaver` is a library crate, so we don't need the SBOM /
  # tarball / Sigstore-attestation steps the reusable workflow adds.
  publish:
    name: Publish to crates.io
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && !inputs.dry-run) }}
    permissions:
      contents: read
      # Mints the OIDC identity token crates.io exchanges for a
      # short-lived publish token. Without it the auth step fails.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      # Trusted publishing: swaps this job's GitHub OIDC identity for a
      # temporary crates.io token, revoked by the action's post step when
      # the job ends. Needs a trusted publisher on crates.io (repo +
      # release.yml) for each of the four workspace crates.
      - name: Authenticate with crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1
      - name: cargo publish (dependency order)
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        # The workspace (issue #48) publishes four crates, in dependency
        # order: core, async, staticweaver, cli. Internal dependencies
        # are pinned to the exact version, and cargo publish waits until
        # each crate is in the index before the next one resolves it. A
        # crate already on crates.io at this version (a re-run after a
        # partial publish) is skipped rather than failing the job.
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          for crate in staticweaver-core staticweaver-async staticweaver staticweaver-cli; do
            if curl -sfL -A "staticweaver-release (https://github.com/sebastienrousseau/staticweaver)" \
                "https://crates.io/api/v1/crates/${crate}/${version}" >/dev/null; then
              echo "${crate} ${version} is already on crates.io; skipping"
              continue
            fi
            cargo publish -p "${crate}"
          done

  # SBOM generation + Sigstore keyless signing (issue #44). Runs after
  # the publish succeeded, so the artifacts we sign match what crates.io
  # actually serves. Outputs (CycloneDX JSON + SPDX JSON + .crate +
  # .crate.sigstore.json bundle) attach to the GitHub Release.
  sbom-and-sign:
    name: SBOM + Sigstore
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: ${{ github.event_name == 'push' }}
    permissions:
      contents: write   # gh release upload
      id-token: write   # cosign keyless OIDC against the Sigstore Fulcio CA
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Extract version from tag
        id: ver
        run: |
          # github.ref_name is e.g. "v0.0.4" — strip the leading "v".
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Install cargo-cyclonedx (CycloneDX SBOM)
        run: cargo install --locked cargo-cyclonedx

      - name: Install cargo-sbom (SPDX SBOM)
        run: cargo install --locked cargo-sbom

      - name: Generate CycloneDX SBOMs (one per crate)
        # In a workspace cargo-cyclonedx writes crates/<crate>/bom.json.
        run: |
          set -euo pipefail
          cargo cyclonedx --format json --override-filename bom
          for crate in staticweaver-core staticweaver-async staticweaver staticweaver-cli; do
            mv "crates/${crate}/bom.json" "${crate}-${{ steps.ver.outputs.version }}.cdx.json"
          done

      - name: Generate SPDX SBOM (whole workspace)
        run: |
          cargo sbom > "staticweaver-${{ steps.ver.outputs.version }}.spdx.json"

      - name: cargo package (re-create the .crate we just published)
        # `--allow-dirty` because the previous steps drop the
        # CycloneDX + SPDX SBOM JSONs into the repo root. Safe:
        # `cargo package` only ingests git-tracked files, so the
        # SBOMs sitting alongside cannot reach the .crate artifact.
        # Without this flag v0.0.4's SBOM+Sigstore job failed even
        # though Publish to crates.io had already succeeded.
        run: cargo package --workspace --no-verify --allow-dirty

      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Sign each .crate via Sigstore (keyless OIDC)
        run: |
          set -euo pipefail
          for crate in staticweaver-core staticweaver-async staticweaver staticweaver-cli; do
            CRATE="target/package/${crate}-${{ steps.ver.outputs.version }}.crate"
            # cosign 3 (installer v4) writes signature, certificate and
            # transparency-log proof into one Sigstore bundle; the
            # separate --output-signature/--output-certificate files are
            # deprecated. Verify with `cosign verify-blob --bundle`.
            cosign sign-blob --yes \
              --bundle "${CRATE}.sigstore.json" \
              "${CRATE}"
          done

      - name: Attach SBOM + signature to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # The Release may not exist yet (created post-publish by the
          # maintainer's finalize-vX.Y.Z.sh). Wait briefly, otherwise
          # create it ourselves so artifacts always have a home.
          for _ in 1 2 3 4 5; do
            if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
              break
            fi
            sleep 6
          done
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" \
              --title "staticweaver ${GITHUB_REF_NAME#v}" \
              --generate-notes
          fi
          v="${{ steps.ver.outputs.version }}"
          assets=("staticweaver-${v}.spdx.json")
          for crate in staticweaver-core staticweaver-async staticweaver staticweaver-cli; do
            assets+=("${crate}-${v}.cdx.json"
                     "target/package/${crate}-${v}.crate"
                     "target/package/${crate}-${v}.crate.sigstore.json")
          done
          gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber

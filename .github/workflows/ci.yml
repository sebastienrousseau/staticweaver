# Unified CI Pipeline
# Uses reusable workflows from sebastienrousseau/pipelines
# Replaces: audit.yml, check.yml, lint.yml, test.yml, coverage.yml

name: CI

on:
  push:
    branches:
      - main
      - "feat/**"
  pull_request:
    branches:
      - main
      - "feat/**"

# Least privilege: every job only reads the repository. A job that
# needs more (osv-scanner uploads SARIF) widens it for itself.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Rust CI
    uses: sebastienrousseau/pipelines/.github/workflows/rust-ci.yml@0e32d48f9ec5e8b684eb3fdd666c66e728eb9864 # main 2026-11-07
    with:
      rust-version: 'stable'
      run-clippy: true
      run-fmt: true
      run-audit: true
      run-coverage: true
      # Fan out test runs to macOS + Windows runners. Keeps cross-platform
      # regressions (path separators, line endings, TLS backends, …) out
      # of the tree before merge.
      run-cross-platform: true
    secrets: inherit

  # Nightly toolchain tests (optional, continue on error)
  test-nightly:
    name: Test (nightly)
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      # rust-toolchain.toml pins `stable`, and rustup prefers that file
      # over the toolchain installed below, so without this the job
      # ran on stable.
      RUSTUP_TOOLCHAIN: nightly
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@2c76c034f9e32a5d6e2c104dc4df23a22476db04 # nightly
      - name: The nightly toolchain is the one in use
        run: rustc --version | grep -F -- '-nightly'

      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Run tests
        run: cargo test --all-features

  # Miri — undefined-behaviour interpreter (issue #42). Even with
  # `#![forbid(unsafe_code)]` at the crate root, Miri catches UB
  # introduced by derive-macro output (thiserror) and transitive deps
  # (fnv, tempfile). A hard gate: the job was meant to become one in
  # v0.0.5 but kept `continue-on-error` until v0.0.10, when its run on
  # the release PR passed every library test of the workspace (308
  # staticweaver, 86 staticweaver-core).
  miri:
    name: Miri (nightly, --lib)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install Rust nightly + Miri
        uses: dtolnay/rust-toolchain@2c76c034f9e32a5d6e2c104dc4df23a22476db04 # nightly
        with:
          components: miri
      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: cargo miri setup
        run: cargo +nightly miri setup
      - name: cargo miri test --lib
        env:
          # Skip Miri's strict isolation so filesystem-touching unit
          # tests (FsLoader smoke tests) can read template fixtures.
          MIRIFLAGS: "-Zmiri-disable-isolation"
        run: cargo +nightly miri test --lib --no-fail-fast

  # OSV-Scanner — covers GHSA + RUSTSEC + crates.io advisories
  # (issue #46). Complements the existing `Rust CI / Audit` (cargo-audit
  # only sees RUSTSEC). Fails on CVSS >= 7.0.
  osv-scanner:
    name: OSV-Scanner
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Run OSV-Scanner
        uses: google/osv-scanner-action/osv-scanner-action@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
        with:
          scan-args: |-
            --lockfile=./Cargo.lock
            --format=table

  # cargo-vet — supply-chain audit (issue #45). Covers the human-review
  # side of supply chain (cargo-audit + osv-scanner cover the CVE side).
  # Imports trusted audits from Mozilla, Google, bytecode-alliance,
  # Embark. Remaining unaudited deps are exempted in
  # supply-chain/config.toml. Adding a new dep that isn't covered by an
  # import nor exempted fails this gate.
  cargo-vet:
    name: cargo-vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Install cargo-vet
        run: cargo install --locked cargo-vet
      - name: cargo vet check (soft gate for v0.0.4)
        # The remote audit imports (Mozilla hg, etc.) flake
        # intermittently — `cargo vet check` exits non-zero on any
        # unreachable import. Soft-gated for v0.0.4 (always exits 0,
        # warning surfaced in the Actions log); promotion to hard gate
        # is scheduled for v0.0.5 alongside a `cargo vet prune` pass
        # that drops the least-reliable imports.
        run: |
          if ! cargo vet check; then
            echo "::warning::cargo vet check failed (soft-gated for v0.0.4 — see ci.yml comment)"
          fi

  # Line-coverage floor. The reusable `rust-ci.yml` already reports to
  # Codecov; this job additionally enforces a hard gate inside the repo
  # so a coverage regression fails the PR directly, without waiting on
  # Codecov status-check propagation.
  coverage-gate:
    name: Coverage >= 98%
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Install cargo-llvm-cov
        run: cargo install --locked cargo-llvm-cov
      - name: Measure + enforce
        run: |
          set -euo pipefail
          summary="$(cargo llvm-cov --all-features --summary-only 2>&1)"
          echo "$summary"
          cov="$(printf '%s\n' "$summary" \
                 | awk '/^TOTAL/ {for (i=1;i<=NF;i++) if ($i ~ /%$/) last=$i} END {gsub("%","",last); print last}')"
          echo "line coverage: ${cov}%"
          awk -v c="$cov" 'BEGIN {exit !(c+0 >= 98.0)}' \
            || { echo "::error::line coverage ${cov}% below 98% floor"; exit 1; }

  # README ↔ Cargo.toml version consistency gate. Added in v0.0.4 after
  # the v0.0.3 release shipped with README install snippets stuck at
  # "0.0.2". Fast (~1s) so it can run on every push.
  version-consistency:
    name: README ↔ Cargo.toml version match
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: ./scripts/check-version-consistency.sh

  # Documentation build + coverage gate. Docs are published by docs.rs on
  # release; this job only smoke-tests that the crate documents cleanly
  # (no broken links, no missing docs) and keeps example coverage at 100%.
  docs:
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - name: Install Rust nightly (for --show-coverage)
        uses: dtolnay/rust-toolchain@2c76c034f9e32a5d6e2c104dc4df23a22476db04 # nightly

      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Build docs (all features, strict)
        env:
          RUSTDOCFLAGS: "-D warnings -D rustdoc::broken_intra_doc_links -D rustdoc::private_intra_doc_links"
        run: cargo doc --no-deps --all-features

      - name: Run doctests (all features)
        run: cargo test --doc --all-features

      - name: Enforce 100% doc-example coverage
        # One gate per library crate of the workspace (issue #48).
        run: |
          set -euo pipefail
          for crate in staticweaver-core staticweaver-async staticweaver; do
            echo "::group::${crate}"
            output="$(cargo +nightly rustdoc -p "${crate}" --lib --all-features -- \
              -Z unstable-options --show-coverage 2>&1 | tee /dev/stderr)"

            # Nightlies from roughly 2026-08 write the coverage table to
            # target/doc/<crate>.txt and print only "Generated output into
            # ..." on stdout. Older ones print the table itself. Parsing
            # stdout unconditionally silently yielded an empty total, and
            # the gate then failed with "Example coverage is ;" while
            # coverage was in fact 100% — a broken parse reported as a
            # coverage regression. Prefer the file when one is named.
            report="$(printf '%s\n' "$output" \
              | sed -n 's/.*Generated output into "\(.*\)".*/\1/p' | tail -1)"
            if [ -n "${report}" ] && [ -f "${report}" ]; then
              echo "Reading coverage table from ${report}"
              output="$(cat "${report}")"
            fi

            total="$(printf '%s\n' "$output" | awk '/^\| Total/ {print $(NF-1)}')"
            if [ -z "${total}" ]; then
              echo "::error::Could not parse the example-coverage table."
              echo "::error::This is a parse failure, not a coverage result."
              exit 1
            fi
            echo "${crate} example coverage: ${total}"
            if [ "${total}" != "100.0%" ]; then
              echo "::error::${crate}: example coverage is ${total}; expected 100.0%"
              exit 1
            fi
            echo "::endgroup::"
          done

  # Every version-bearing file must name Cargo.toml's version, so a tag
  # can never again ship with the previous one (see the script).
  release-preflight:
    name: Release preflight
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: ./scripts/release-preflight.sh

  # staticweaver-core builds without std (issue #49): the cross-compile
  # gates `make nostd` runs locally, with and without the json filter.
  no-std:
    name: no_std (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [thumbv7em-none-eabihf, wasm32-wasip2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo build -p staticweaver-core --no-default-features --target "${{ matrix.target }}"
      - run: cargo build -p staticweaver-core --no-default-features --features json --target "${{ matrix.target }}"

  # The WASI Preview 2 example (issue #50) builds as a wasm32-wasip2
  # component. Build only: running it needs Wasmtime (see the header of
  # crates/staticweaver-core/examples/wasi.rs).
  wasi-example:
    name: WASI Preview 2 example
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: wasm32-wasip2
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo build -p staticweaver-core --example wasi --target wasm32-wasip2 --release
      - name: The component exists
        run: test -s target/wasm32-wasip2/release/examples/wasi.wasm
